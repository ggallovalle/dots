# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """${custom.homepath}$character"""
right_format = """$git_branch"""

[custom.homepath]
description = "home-shortened path"
command = "kbsh homepath"
when = true
style = "blue"
format = "[$output]($style)\n"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

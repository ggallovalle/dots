"$schema" = 'https://starship.rs/config-schema.json'

format = """${git_branch}\n${directory}\n$character"""

[[directory.substitutions]]
from = "~/ghq"
to = "$GHQ_ROOT"

[[directory.substitutions]]
from = "~/.config"
to = "$XDG_CONFIG_HOME"

[[directory.substitutions]]
from = "~/.cache"
to = "$XDG_CACHE_HOME"

[[directory.substitutions]]
from = "~/.local/state"
to = "$XDG_STATE_HOME"

[[directory.substitutions]]
from = "~/.local/share"
to = "$XDG_DATA_HOME"

[[directory.substitutions]]
from = "dots"
to = "$DOTFILES"

[git_branch]
format ="[$symbol$branch(:$remote_branch)]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

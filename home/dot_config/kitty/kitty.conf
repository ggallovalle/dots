font_family GeistMono Nerd Font, JetBrains Mono, Noto Sans Mono
font_size 14
font_features GeistMono Nerd Font +calt +clig +liga +dlig

shell /bin/zsh -l

hide_window_decorations titlebar-only
background_opacity 1.0
confirm_os_window_close 0
window_padding_width 0

cursor_shape underline
cursor_underline_width 2.0
cursor_blink_interval 0
cursor_trail 3
cursor_trail_color #a3b4eb

foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc
cursor_text_color #1e1e2e
selection_foreground #cdd6f4
selection_background #45475a

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

tab_bar_style powerline
tab_bar_edge top
tab_bar_background #1e1e2e
active_tab_foreground #cdd6f4
active_tab_background #313244
inactive_tab_foreground #585b70
inactive_tab_background #1e1e2e
hide_tab_bar_if_only_one_tab yes

map alt+tab next_tab
map alt+shift+tab previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+d launch --type=os-window codex

scrollback_lines 10000

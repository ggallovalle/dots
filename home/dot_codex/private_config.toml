#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.3-codex"
model_reasoning_effort = "medium"
moddel_verbosity = "low"
approvals_reviewer = "user"
personality = "pragmatic"

[projects."/home/kbroom"]
trust_level = "trusted"

[projects."/home/kbroom/dev/kbroom/kbpkg"]
trust_level = "trusted"

[projects."/home/kbroom/dots"]
trust_level = "trusted"

[tui]
notifications = true
vim_mode = true
vim_mode_initial_state = "insert"


[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[features]
terminal_resize_reflow = true
goals = true
undo = true

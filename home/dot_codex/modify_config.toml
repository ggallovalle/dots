#!/usr/bin/env -S uv run --script
# vim: ft=python
# /// script
# requires-python = ">=3.11"
# dependencies = [
#   "tomlkit>=0.13.0",
# ]
# ///

import os
import sys
from pathlib import Path

import tomlkit
PORTABLE = {
    "model": "gpt-5.4-mini",
    "model_reasoning_effort": "low",
    "model_verbosity": "low",
    "approvals_reviewer": "auto_review",
    "personality": "pragmatic",

    "tui": {
        "notifications": True,
        "vim_mode_default": True,
        "model_availability_nux": {
            "gpt-5.5": 4,
        },
        "keymap": {
            "composer": {
                "submit": "\\",
            },
            "pager": {
                "half_page_up": "ctrl-u",
                "half_page_down": "ctrl-d",
            },
        },
    },

    "notice": {
        "hide_full_access_warning": True,
        "model_migrations": {
            "gpt-5.3-codex": "gpt-5.4",
        },
    },

    "features": {
        "hooks": True,
        "terminal_resize_reflow": True,
        "goals": True,
        "undo": True,
    },
    "sandbox_workspace_write": {
        "writable_roots": [
            os.environ.get("XDG_CACHE_HOME", str(Path.home() / ".cache"))
            ]
    },
    "mcp_servers": {
        "fff": {
            "command": "fff-mcp",
            "default_tools_approval_mode": "approve"
            }
        }
}

PORTABLE_TOP_KEYS = {
    "model",
    "model_reasoning_effort",
    "model_verbosity",
    "approvals_reviewer",
    "personality",
    "tui",
    "notice",
    "features",
    "mcp_servers"
}

raw = sys.stdin.read()

try:
    existing = tomlkit.parse(raw) if raw.strip() else tomlkit.document()
except tomlkit.exceptions.ParseError as err:
    sys.stderr.write(f"Codex config.toml is invalid TOML; refusing to modify: {err}\n")
    sys.exit(1)

for key in PORTABLE_TOP_KEYS:
    if key in existing:
        del existing[key]

merged = tomlkit.document()
for key, value in PORTABLE.items():
    merged[key] = value
for key, value in existing.items():
    merged[key] = value

print("#:schema https://developers.openai.com/codex/config-schema.json\n")
sys.stdout.write(tomlkit.dumps(merged))
